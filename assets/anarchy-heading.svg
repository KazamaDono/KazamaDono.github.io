<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-label="ANARCHY" preserveAspectRatio="xMidYMid meet">
  <title>ANARCHY</title>
  <defs>
    <filter id="neon" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur stdDeviation="2" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes flicker {
        0%, 17%, 21%, 61%, 64%, 100% { opacity: 1; }
        18%, 20% { opacity: .30; }
        62%      { opacity: .55; }
      }
      @keyframes drift-light {
        0%, 100% { transform: translate(0px, 0px); }
        20%      { transform: translate(-5px, -1px); }
        45%      { transform: translate( 4px,  1px); }
        70%      { transform: translate(-2px,  2px); }
        88%      { transform: translate( 2px, -2px); }
      }
      @keyframes drift-dark {
        0%, 100% { transform: translate(0px, 0px); }
        20%      { transform: translate( 5px,  1px); }
        45%      { transform: translate(-4px, -1px); }
        70%      { transform: translate( 2px, -2px); }
        88%      { transform: translate(-2px,  2px); }
      }
      @keyframes slice {
        0%, 55%, 100% { clip-path: inset(0 0 0 0); }
        6%   { clip-path: inset(14% 0 66% 0); }
        13%  { clip-path: inset(46% 0 34% 0); }
        22%  { clip-path: inset(72% 0  8% 0); }
        30%  { clip-path: inset(26% 0 56% 0); }
        43%  { clip-path: inset(60% 0 18% 0); }
      }
      @keyframes jitter {
        0%, 100% { transform: translate(0px, 0px); }
        23%      { transform: translate(1px, -1px); }
        47%      { transform: translate(-1px, 1px); }
        68%      { transform: translate(1px, 1px); }
        84%      { transform: translate(-1px, -1px); }
      }
      .a-txt   {
        font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Consolas, Menlo, 'Courier New', ui-monospace, monospace;
        font-weight: 900;
        font-size: 152px;
        letter-spacing: 10px;
      }
      .a-main  { fill: #ff0a3d; filter: url(#neon); animation: flicker 3.4s infinite steps(1), jitter 0.22s infinite steps(1); }
      .a-light { fill: #ff5c73; opacity: .55;             animation: drift-light 1.9s infinite ease-in-out; }
      .a-deep  { fill: #7a0016; opacity: .80;             animation: drift-dark  1.9s infinite ease-in-out; }
      .a-slice { animation: slice 3.1s infinite steps(1); }
    </style>
  </defs>
  <g transform="translate(450 130)" text-anchor="middle">
    <text class="a-txt a-deep"          x="0" y="0">ANARCHY</text>
    <text class="a-txt a-light"         x="0" y="0">ANARCHY</text>
    <text class="a-txt a-main a-slice"  x="0" y="0">ANARCHY</text>
  </g>
</svg>
